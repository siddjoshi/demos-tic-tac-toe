<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Main game container with glassmorphic design -->
    <div class="container">
        <!-- Game title -->
        <h1>Tic Tac Toe</h1>
        
        <!-- Game status display: shows current player or game result -->
        <div class="game-info">
            <div id="game-status">Player X's Turn</div>
        </div>
        
        <!-- 
            Game board: 3x3 grid of clickable cells
            Each cell has a data-index attribute (0-8) for JavaScript reference
            Cell numbering:
            0 1 2
            3 4 5
            6 7 8
        -->
        <div class="game-board" id="game-board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        
        <!-- 
            Game controls
            Single click: Reset game (keep scores)
            Double click: Reset all scores (with confirmation)
        -->
        <div class="game-controls">
            <button id="reset-button">Reset Game</button>
        </div>
        
        <!-- 
            Scoreboard: displays win counts and draws
            Scores persist across multiple game rounds
        -->
        <div class="score-board">
            <div class="score">
                <span>Player X: </span>
                <span id="score-x">0</span>
            </div>
            <div class="score">
                <span>Player O: </span>
                <span id="score-o">0</span>
            </div>
            <div class="score">
                <span>Draws: </span>
                <span id="score-draw">0</span>
            </div>
        </div>
    </div>
    
    <!-- Main game script -->
    <script src="script.js"></script>
</body>
</html>
